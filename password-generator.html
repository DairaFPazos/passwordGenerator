<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center transition-colors">
    <button onclick="toggleDarkMode()" class="fixed top-4 right-4 z-10 p-3 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 shadow-lg hover:shadow-xl transform hover:scale-105 transition-all duration-300">
        <span id="theme-icon" class="text-white text-lg">🌙</span>
    </button>
    
    <div class="max-w-md w-full mx-4">
        
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white mb-6 text-center">Password Generator</h1>
        
            <div class="mb-4 text-center">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    Length: 
                    <input type="number" id="length" value="12" min="1" max="100" 
                           class="ml-2 w-16 px-2 py-1 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </label>
            </div>
        
            <div class="space-y-4 mb-6">
                <label class="flex items-center p-3 rounded-lg bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors cursor-pointer">
                    <input type="checkbox" id="numbers" checked class="mr-4 h-5 w-5 text-blue-600 focus:ring-2 focus:ring-blue-500 border-2 border-gray-300 dark:border-gray-500 rounded-md">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Numbers (0-9)</span>
                </label>
                
                <label class="flex items-center p-3 rounded-lg bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors cursor-pointer">
                    <input type="checkbox" id="alphabetic" checked class="mr-4 h-5 w-5 text-blue-600 focus:ring-2 focus:ring-blue-500 border-2 border-gray-300 dark:border-gray-500 rounded-md">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Alphabetic (a-z, A-Z)</span>
                </label>
                
                <label class="flex items-center p-3 rounded-lg bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors cursor-pointer">
                    <input type="checkbox" id="special" checked class="mr-4 h-5 w-5 text-blue-600 focus:ring-2 focus:ring-blue-500 border-2 border-gray-300 dark:border-gray-500 rounded-md">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Special Characters (!@#$%^&*)</span>
                </label>
                
                <label class="flex items-center p-3 rounded-lg bg-gray-50 dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors cursor-pointer">
                    <input type="checkbox" id="extended" class="mr-4 h-5 w-5 text-blue-600 focus:ring-2 focus:ring-blue-500 border-2 border-gray-300 dark:border-gray-500 rounded-md">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Extended ASCII (128-255)</span>
                </label>
            </div>
        
            <button onclick="generatePassword()" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 mb-4">
                Generate Password
            </button>
            
            <textarea id="password" rows="3" readonly 
                      placeholder="Generated password will appear here..." 
                      class="w-full p-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-700 text-center"></textarea>
            
            <div id="entropy-section" class="mt-4 hidden">
                <div class="text-center mb-2">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Password Strength: </span>
                    <span id="entropy-bits" class="text-sm font-bold text-blue-600 dark:text-blue-400"></span>
                </div>
                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3">
                    <div id="entropy-bar" class="h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="text-center mt-1">
                    <span id="entropy-label" class="text-xs text-gray-600 dark:text-gray-400"></span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            let chars = '';
            
            if (document.getElementById('numbers').checked) chars += '0123456789';
            if (document.getElementById('alphabetic').checked) chars += 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (document.getElementById('special').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            if (document.getElementById('extended').checked) {
                for (let i = 128; i <= 255; i++) chars += String.fromCharCode(i);
            }
            
            if (!chars) {
                alert('Please select at least one character type');
                return;
            }
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.getElementById('password').value = password;
            calculateEntropy(chars.length, length);
        }
        
        function calculateEntropy(charsetSize, length) {
            const entropy = Math.log2(Math.pow(charsetSize, length));
            const entropySection = document.getElementById('entropy-section');
            const entropyBits = document.getElementById('entropy-bits');
            const entropyBar = document.getElementById('entropy-bar');
            const entropyLabel = document.getElementById('entropy-label');
            
            entropyBits.textContent = `${entropy.toFixed(1)} bits`;
            
            let strength, color, percentage;
            if (entropy < 30) {
                strength = 'Very Weak';
                color = 'bg-red-500';
                percentage = 20;
            } else if (entropy < 50) {
                strength = 'Weak';
                color = 'bg-orange-500';
                percentage = 40;
            } else if (entropy < 70) {
                strength = 'Fair';
                color = 'bg-yellow-500';
                percentage = 60;
            } else if (entropy < 90) {
                strength = 'Strong';
                color = 'bg-green-500';
                percentage = 80;
            } else {
                strength = 'Very Strong';
                color = 'bg-green-600';
                percentage = 100;
            }
            
            entropyLabel.textContent = strength;
            entropyBar.className = `h-3 rounded-full transition-all duration-500 ${color}`;
            entropyBar.style.width = `${percentage}%`;
            entropySection.classList.remove('hidden');
        }
        
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
            localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
        }
        
        // Load saved theme
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').textContent = '☀️';
        }
    </script>
</body>
</html>
